[project]
name = "pkipy"
version = "0.1.0"
description = "Pure Python PowerShell Authenticode Signer with RFC3161 Timestamping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "asn1crypto>=1.5.1",
    "rfc3161ng>=2.1.3",
    "requests>=2.31.0",
    "configargparse>=1.7",
    "pyyaml>=6.0.1",
]

[project.scripts]
pkipy = "pkipy.__main__:main"
dasn1 = "pkipy.dasn1:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
